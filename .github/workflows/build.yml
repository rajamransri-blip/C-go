name: Auto Setup and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android Workload
        run: |
          dotnet workload install android --skip-manifest-update

      - name: Auto-Generate Project Structure & Shizuku Config
        run: |
          # 1. Project file with exact target framework and bypasses
          cat << 'EOF' > GfxTool.csproj
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net9.0-android</TargetFramework>
              <SupportedOSPlatformVersion>21.0</SupportedOSPlatformVersion>
              <OutputType>Exe</OutputType>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <ApplicationId>com.kuronami.gfxtool</ApplicationId>
              <ApplicationVersion>1</ApplicationVersion>
              <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
              <CheckEolWorkloads>false</CheckEolWorkloads>
              <CheckEolTargetFramework>false</CheckEolTargetFramework>
              <NoWarn>$(NoWarn);NETSDK1202;NETSDK1138</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="System.Text.Json" Version="9.0.0" />
            </ItemGroup>
          </Project>
          EOF

          # 2. Android Manifest with Shizuku & Full Storage declarations
          mkdir -p Platforms/Android
          cat << 'EOF' > Platforms/Android/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.kuronami.gfxtool">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <application android:allowBackup="true" android:label="Kuronami GFX" android:supportsRtl="true">
              </application>
          </manifest>
          EOF

          # 3. Model Definition
          cat << 'EOF' > ConfigItem.cs
          using System.Text.Json.Serialization;

          namespace KuronamiGfx;

          public class ConfigItem
          {
              [JsonPropertyName("id")]
              public string Id { get; set; } = string.Empty;

              [JsonPropertyName("title")]
              public string Title { get; set; } = string.Empty;

              [JsonPropertyName("file_url")]
              public string FileUrl { get; set; } = string.Empty;

              [JsonPropertyName("file_name")]
              public string FileName { get; set; } = string.Empty;

              [JsonPropertyName("target_subpath")]
              public string TargetSubpath { get; set; } = string.Empty;

              public bool IsDownloaded { get; set; }
          }
          EOF

          # 4. Privileged Shizuku Command Execution
          cat << 'EOF' > ShizukuService.cs
          using System;
          using System.Diagnostics;

          namespace KuronamiGfx;

          public static class ShizukuService
          {
              public static void ExecuteShizuku(string command)
              {
                  try
                  {
                      var proc = new Process
                      {
                          StartInfo = new ProcessStartInfo
                          {
                              FileName = "/system/bin/sh",
                              Arguments = $"-c \"/data/local/tmp/rish -c '{command}'\"",
                              UseShellExecute = false,
                              RedirectStandardOutput = true
                          }
                      };
                      proc.Start();
                      proc.WaitForExit();
                  }
                  catch { }
              }

              public static void ApplyConfig(string localPath, string packageName, string targetSubpath, string fileName)
              {
                  string destDir = $"/sdcard/Android/data/{packageName}/{targetSubpath}";
                  string destFile = $"{destDir}/{fileName}";
                  ExecuteShizuku($"mkdir -p '{destDir}'");
                  ExecuteShizuku($"cp '{localPath}' '{destFile}'");
                  ExecuteShizuku($"chmod 660 '{destFile}'");
              }
          }
          EOF

          # 5. Native Android UI with Dynamic State Switch
          cat << 'EOF' > MainActivity.cs
          using System;
          using System.IO;
          using System.Net.Http;
          using Android.App;
          using Android.OS;
          using Android.Widget;
          using Android.Graphics;

          namespace KuronamiGfx;

          [Activity(Label = "Kuronami GFX", MainLauncher = true)]
          public class MainActivity : Activity
          {
              private LinearLayout? _container;
              private readonly HttpClient _http = new();

              protected override void OnCreate(Bundle? savedInstanceState)
              {
                  base.OnCreate(savedInstanceState);

                  var scroll = new ScrollView(this);
                  _container = new LinearLayout(this)
                  {
                      Orientation = Orientation.Vertical
                  };
                  _container.SetPadding(40, 60, 40, 60);
                  _container.SetBackgroundColor(Color.ParseColor("#090D16"));
                  scroll.AddView(_container);
                  SetContentView(scroll);

                  var title = new TextView(this)
                  {
                      Text = "KURONAMI GFX",
                      TextSize = 24,
                      Typeface = Typeface.DefaultBold
                  };
                  title.SetTextColor(Color.ParseColor("#00E5FF"));
                  _container.AddView(title);

                  RenderCard(new ConfigItem
                  {
                      Id = "1",
                      Title = "BGMI LUA PAK V1",
                      FileName = "Active.sav",
                      TargetSubpath = "files/UE4Game/ShadowTrackerExtra/ShadowTrackerExtra/Saved/SaveGames",
                      FileUrl = "https://raw.githubusercontent.com/actions/starter-workflows/main/README.md"
                  });
              }

              private void RenderCard(ConfigItem item)
              {
                  var card = new LinearLayout(this) { Orientation = Orientation.Vertical };
                  card.SetBackgroundColor(Color.ParseColor("#161B22"));
                  card.SetPadding(30, 30, 30, 30);

                  var label = new TextView(this) { Text = item.Title, TextSize = 16 };
                  label.SetTextColor(Color.White);
                  card.AddView(label);

                  var btn = new Button(this) { Text = "DOWNLOAD" };
                  btn.SetBackgroundColor(Color.ParseColor("#007ACC"));
                  btn.SetTextColor(Color.White);

                  btn.Click += async (s, e) =>
                  {
                      string localPath = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.Personal), item.FileName);
                      if (!item.IsDownloaded)
                      {
                          btn.Text = "DOWNLOADING...";
                          btn.Enabled = false;
                          try
                          {
                              var data = await _http.GetByteArrayAsync(item.FileUrl);
                              await File.WriteAllBytesAsync(localPath, data);
                              item.IsDownloaded = true;
                              btn.Text = "APPLY";
                              btn.SetBackgroundColor(Color.ParseColor("#10B981"));
                          }
                          catch
                          {
                              btn.Text = "DOWNLOAD FAILED";
                          }
                          finally
                          {
                              btn.Enabled = true;
                          }
                      }
                      else
                      {
                          btn.Text = "APPLYING...";
                          btn.Enabled = false;
                          ShizukuService.ApplyConfig(localPath, "com.pubg.imobile", item.TargetSubpath, item.FileName);
                          btn.Text = "APPLIED";
                          btn.SetBackgroundColor(Color.ParseColor("#6366F1"));
                      }
                  };

                  card.AddView(btn);
                  _container?.AddView(card);
              }
          }
          EOF

      - name: Sync and Push Source to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-scaffold project sources with Shizuku integration"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi

      - name: Restore Dependencies
        run: |
          dotnet restore GfxTool.csproj -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false

      - name: Build Android APK
        run: |
          dotnet build GfxTool.csproj -c Release -f net9.0-android -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false

      - name: Locate Output APK
        id: find-apk
        run: |
          APK_FILE=$(find bin/Release -type f -name "*-Signed.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          fi
          echo "Discovered APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuronami-GFX-Release
          path: ${{ env.apk_path }}
          retention-days: 7
